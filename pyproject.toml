[project]
name = "opinionlab"
version = "1.3.1"
description = "OpinionLab — reproducible, high-performance opinion-dynamics simulation sandbox (hnle engine + service layer)."
requires-python = ">=3.12,<3.13"
dependencies = ["hnle", "opinionlab-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/hnle", "apps/api"]

[tool.uv.sources]
hnle = { workspace = true }
opinionlab-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "hypothesis==6.170.15",
    "pytest-benchmark==5.3.1",
    "mypy==1.9.0",
    "ruff==0.3.5",
    "pandas-stubs==2.2.0.240218",
    "pip-audit==2.7.3",
    "locust==2.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["hnle"]

[tool.ruff.lint.per-file-ignores]
"packages/hnle/src/hnle/cli.py" = ["B008", "UP007"]
"apps/api/app/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/hnle/src", "apps/api/app"]
mypy_path = "packages/hnle/src:apps/api"
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "pyarrow.*", "matplotlib.*", "celery.*", "kombu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py", "bench_*.py"]
markers = ["slow: long-running performance benchmarks"]
