[project]
name = "opinionlab"
version = "0.1.0"
description = "OpinionLab — reproducible, high-performance opinion-dynamics simulation sandbox (hnle engine + service layer)."
requires-python = ">=3.12,<3.13"
dependencies = ["hnle"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/hnle"]

[tool.uv.sources]
hnle = { workspace = true }

[dependency-groups]
dev = [
    "pytest==8.0.0",
    "pytest-asyncio==0.23.5",
    "hypothesis==6.98.0",
    "pytest-benchmark==4.0.0",
    "mypy==1.9.0",
    "ruff==0.3.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["hnle"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/hnle/src"]
mypy_path = "packages/hnle/src"
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "bench_*.py"]
markers = ["slow: long-running performance benchmarks"]
