# Single-container demo deployment. Use this when you want the real engine and
# offline HTML reports without PostgreSQL, Redis or MinIO:
#
#   docker compose -f docker-compose.demo.yml up --build
#   open http://127.0.0.1:8000/api/v1/demo/app
#
# Auth, persisted runs, quotas and the worker queue are intentionally absent;
# use docker-compose.yml for the full service.
name: opinionlab-demo

services:
  demo:
    build:
      context: .
      dockerfile: deploy/docker/demo.Dockerfile
    restart: unless-stopped
    environment:
      OPINIONLAB_ENV: production
      JWT_SECRET: ${JWT_SECRET:-demo-only-not-for-shared-use-change-me}
      DEMO_MAX_NODES: ${DEMO_MAX_NODES:-400}
      DEMO_MAX_STEPS: ${DEMO_MAX_STEPS:-200}
      DEMO_MAX_REPEATS: ${DEMO_MAX_REPEATS:-20}
      DEMO_MIN_STEPS: ${DEMO_MIN_STEPS:-10}
      DEMO_MIN_REPEATS: ${DEMO_MIN_REPEATS:-1}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    ports:
      - "${DEMO_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
