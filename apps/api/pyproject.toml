[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opinionlab-api"
version = "1.3.1"
description = "OpinionLab service layer (FastAPI + SQLAlchemy)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.27.1",
    "sqlalchemy[asyncio]==2.0.27",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "pydantic-settings==2.2.1",
    "celery==5.3.6",
    "redis==5.0.2",
    "argon2-cffi==23.1.0",
    "python-jose[cryptography]==3.3.0",
    "structlog==24.1.0",
    "minio==7.2.7",
    "prometheus-client==0.20.0",
    "httpx==0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
