[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hnle"
version = "1.4.0"
description = "OpinionLab engine: hybrid hypergraph non-linear latency voter model."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.12.0",
    "pandas==2.2.0",
    "pyarrow==23.0.1",
    "pydantic==2.14.3",
    "typer==0.12.3",
    "click==8.1.7",
    "rich==13.7.1",
    "matplotlib==3.8.3",
    "jinja2==3.1.6",
    "pyyaml==6.0.1",
]

[project.scripts]
hnle = "hnle.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hnle"]
